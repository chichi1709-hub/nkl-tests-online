<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">

<title>Week 4 Review Day Quiz</title>

<style>
img{max-width:100%}
:root{
  --bg:#eef5ea; --card:#ffffff; --ink:#233a2a; --muted:#6f8374; --line:#d7e6cd;
  --green:#3f9440; --green-d:#2f7a33; --green-soft:#eaf5e6;
  --blue:#2b6fb0; --blue-soft:#eaf2fb; --blue-line:#cfe0f2;
  --yellow:#e0a92e; --yellow-soft:#fdf3d2;
  --red:#e2603b; --good:#3f9440; --bad:#e14b3b;
  --ring:rgba(63,148,64,.35);
  --shadow:0 2px 0 rgba(0,0,0,.04),0 8px 24px rgba(40,80,45,.08);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#101a14; --card:#18271e; --ink:#e7f1e6; --muted:#93a898; --line:#284034;
  --green:#6cc06a; --green-d:#7fd07c; --green-soft:#173021;
  --blue:#77b6e6; --blue-soft:#132633; --blue-line:#274a63;
  --yellow:#e9bf59; --yellow-soft:#2a2413;
  --red:#f0795a; --good:#6cc06a; --bad:#f0795a; --ring:rgba(108,192,106,.4);
  --shadow:0 2px 0 rgba(0,0,0,.2),0 10px 26px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#101a14; --card:#18271e; --ink:#e7f1e6; --muted:#93a898; --line:#284034;
  --green:#6cc06a; --green-d:#7fd07c; --green-soft:#173021;
  --blue:#77b6e6; --blue-soft:#132633; --blue-line:#274a63;
  --yellow:#e9bf59; --yellow-soft:#2a2413;
  --red:#f0795a; --good:#6cc06a; --bad:#f0795a; --ring:rgba(108,192,106,.4);
  --shadow:0 2px 0 rgba(0,0,0,.2),0 10px 26px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Nunito",system-ui,Segoe UI,sans-serif;font-size:17px;line-height:1.5;}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 140px;}

header{position:relative;text-align:center;padding:30px 12px 10px;}
.badge-pill{display:inline-block;background:var(--green);color:#fff;font-family:"Fredoka";font-weight:600;
  font-size:13px;letter-spacing:.5px;padding:5px 14px;border-radius:999px;}
h1{font-family:"Fredoka";font-weight:700;font-size:clamp(26px,6vw,40px);margin:12px 0 4px;color:var(--ink);
  text-wrap:balance;line-height:1.05;}
.sub{color:var(--muted);font-weight:600;margin:0;}
.hi{display:flex;justify-content:center;gap:6px;margin:14px 0 0;}
.hi svg{width:56px;height:56px}

.hud{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(8px);padding:10px 0;margin-bottom:8px;}
.hud-in{max-width:760px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px;}
.bar{flex:1;height:12px;border-radius:999px;background:var(--line);overflow:hidden;}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#8ec63f);
  border-radius:999px;transition:width .35s ease;}
.scorechip{font-family:"Fredoka";font-weight:600;font-size:14px;color:var(--green-d);
  background:var(--green-soft);border:1.5px solid var(--line);padding:5px 12px;border-radius:999px;white-space:nowrap;}

.sectionband{font-family:"Fredoka";font-weight:700;color:#fff;border-radius:16px;
  padding:14px 20px;margin:22px 0 10px;background:linear-gradient(90deg,var(--blue),#5aa9d6);
  box-shadow:var(--shadow);}
.sectionband .t{font-size:18px;letter-spacing:.3px;display:block;}
.sectionband .s{font-size:13px;font-weight:600;opacity:.92;display:block;margin-top:3px;}

.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 18px 20px;
  margin:16px 0;box-shadow:var(--shadow);}
.card.blue{border-color:var(--blue-line);}
.chead{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.num{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;
  font-family:"Fredoka";font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;}
.card.blue .num{background:var(--blue);}
.ctitle{font-family:"Fredoka";font-weight:600;font-size:19px;line-height:1.15;text-wrap:balance;}

.w{padding:10px 0;border-top:1px dashed var(--line);}
.w:first-of-type{border-top:0;}
.wq{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap;}
.tile{flex:0 0 auto;width:60px;height:60px;border-radius:12px;background:var(--green-soft);
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.card.blue .tile{background:var(--blue-soft);}
.tile svg{width:56px;height:56px;display:block;}
.wtext{font-weight:700;font-size:17px;flex:1;min-width:160px;}
.letters{font-family:"Fredoka";letter-spacing:3px;font-weight:600;font-size:20px;}

.opts{display:flex;flex-wrap:wrap;gap:8px;}
.opt{font-family:"Nunito";font-weight:700;font-size:16px;color:var(--ink);background:var(--card);
  border:2px solid var(--line);border-radius:12px;padding:9px 16px;cursor:pointer;transition:transform .08s,border-color .15s,background .15s;
  min-height:44px;}
.opt:hover{border-color:var(--green);}
.opt:active{transform:translateY(1px) scale(.99);}
.opt.sel{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);}
.opt.good{background:var(--green-soft);border-color:var(--good);color:var(--green-d);}
.opt.bad{background:color-mix(in srgb,var(--red) 14%,var(--card));border-color:var(--bad);color:var(--bad);}
.opt:focus-visible{outline:3px solid var(--ring);outline-offset:2px;}

input.txt,select.sel{font-family:"Fredoka";font-weight:600;font-size:18px;color:var(--ink);background:var(--card);
  border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-height:44px;}
input.txt{width:96px;text-align:center;}
input.txt.wide{width:170px;}
select.sel{cursor:pointer;min-width:150px;}
input.txt:focus,select.sel:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--ring);}
.mark{font-family:"Fredoka";font-weight:700;margin-left:8px;font-size:16px;}
.mark.good{color:var(--good);}
.mark.bad{color:var(--bad);}
.correct{display:inline-block;margin-left:8px;font-weight:700;color:var(--green-d);}
.field.good input,.field.good select{border-color:var(--good);background:var(--green-soft);}
.field.bad input,.field.bad select{border-color:var(--bad);background:color-mix(in srgb,var(--red) 12%,var(--card));}
.field{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px;}
.passage{background:var(--green-soft);border:2px solid var(--line);border-radius:14px;padding:14px 18px;font-size:16px;}
.passage p{margin:6px 0;}
.pcap{font-size:12px;color:var(--muted);font-style:italic;margin-top:8px;}
textarea.write{width:100%;min-height:88px;font-family:"Nunito";font-size:16px;color:var(--ink);
  background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:12px;resize:vertical;}
textarea.write:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--ring);}

.footer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(10px);border-top:2px solid var(--line);padding:12px 16px;}
.footer-in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;}
.btn{font-family:"Fredoka";font-weight:600;font-size:18px;border:0;border-radius:14px;padding:12px 26px;cursor:pointer;
  min-height:52px;transition:transform .08s,filter .15s;}
.btn:active{transform:translateY(1px) scale(.99);}
.btn-main{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);}
.btn-main:hover{filter:brightness(1.05);}
.btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--line);}
.msg{font-family:"Fredoka";font-weight:600;color:var(--green-d);font-size:16px;}

.result{display:none;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:20px;
  padding:22px;margin:16px 0;box-shadow:var(--shadow);}
.result.show{display:block;animation:pop .4s ease;}
.result .big{font-family:"Fredoka";font-weight:700;font-size:40px;color:var(--green-d);}
.result .stars{font-size:34px;letter-spacing:4px;margin:6px 0;}
.result .rmsg{font-family:"Fredoka";font-weight:600;font-size:22px;margin-top:4px;}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.foot-note{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 0;}
</style>
</head>

<div class="hud">
  <div class="hud-in">

<div class="wrap">
  <header>

</div>

const KEY = "week4reviewday_v1";
let state = {};
try{ state = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ state = {}; }
let checked = false;

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function norm(s){ return (s==null?"":String(s)).toLowerCase().trim().replace(/\s+/g,""); }
function tile(k){ return SVGS[k] ? '<span class="tile">'+SVGS[k]+'</span>' : ''; }

function widgetId(ci,wi){ return "q"+CARDS[ci].n+"_"+wi; }

function render(){
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";
  let colorToggle = 0;
  CARDS.forEach((c,ci)=>{
    if(c.divider){
      const div = document.createElement("div");
      div.className = "sectionband";
      div.innerHTML = '<span class="t">'+c.title+'</span><span class="s">'+c.sub+'</span>';
      quiz.appendChild(div);
      return;
    }
    const blue = colorToggle%2===1; colorToggle++;
    const card = document.createElement("div");
    card.className = "card"+(blue?" blue":"");
    let h = '<div class="chead"><div class="num">'+c.n+'</div><div class="ctitle">'+c.title+'</div></div>';
    c.w.forEach((w,wi)=>{ h += '<div class="w" id="wrap_'+widgetId(ci,wi)+'">'+renderWidget(c,ci,w,wi)+'</div>'; });
    card.innerHTML = h;
    quiz.appendChild(card);
  });
  bind();
  updateHud();
}

function renderWidget(c,ci,w,wi){
  const id = widgetId(ci,wi);
  const cur = state[id];
  const img = w.img ? tile(w.img) : "";
  if(w.k==="choice"){
    const q = w.q ? '<span class="wtext">'+w.q+'</span>' : '';
    let opts = w.opts.map(o=>'<button class="opt'+(cur===o?' sel':'')+'" data-id="'+id+'" data-val="'+esc(o)+'">'+o+'</button>').join('');
    return '<div class="wq">'+img+q+'</div><div class="opts" id="opts_'+id+'">'+opts+'</div>';
  }
  if(w.k==="input"){
    const lab = w.q ? '<span class="letters">'+w.q+'</span>' : '';
    const wide = (w.ans && w.ans.length>2) ? ' wide':'';
    return '<div class="wq">'+img+'<span class="field" id="field_'+id+'">'+lab+
      ' <input class="txt'+wide+'" id="'+id+'" data-id="'+id+'" value="'+esc(cur||"")+'" placeholder="'+(w.ph||"")+'" autocomplete="off"><span class="markslot"></span></span></div>';
  }
  if(w.k==="select"){
    const q = w.q ? '<span class="wtext">'+w.q+'</span>' : '';
    let opts = '<option value="">— choose —</option>'+w.pool.map(o=>'<option value="'+esc(o)+'"'+(cur===o?' selected':'')+'>'+o+'</option>').join('');
    return '<div class="wq">'+img+q+'<span class="field" id="field_'+id+'"><select class="sel" id="'+id+'" data-id="'+id+'">'+opts+'</select><span class="markslot"></span></span></div>';
  }
  if(w.k==="write"){
    return '<div class="wq"><span class="wtext">'+w.q+'</span></div><textarea class="write" data-id="'+id+'" placeholder="Viết câu trả lời của em…">'+esc(cur||"")+'</textarea>';
  }
  return "";
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

function bind(){
  document.querySelectorAll(".opt").forEach(b=>{
    b.addEventListener("click",()=>{
      if(checked) return;
      const id=b.dataset.id, val=b.dataset.val;
      state[id]=val; save();
      document.querySelectorAll('.opt[data-id="'+id+'"]').forEach(x=>x.classList.toggle("sel", x.dataset.val===val));
      updateHud();
    });
  });
  document.querySelectorAll("input.txt, select.sel, textarea.write").forEach(el=>{
    const ev = el.tagName==="SELECT" ? "change":"input";
    el.addEventListener(ev,()=>{ if(checked && el.tagName!=="TEXTAREA") return; state[el.dataset.id]=el.value; save(); updateHud(); });
  });
}

function gradable(){ let t=[]; CARDS.forEach((c,ci)=>{ if(c.divider) return; c.w.forEach((w,wi)=>{ if(w.k!=="write") t.push({id:widgetId(ci,wi),w}); }); }); return t; }
function answeredCount(){ return gradable().filter(g=>{ const v=state[g.id]; return v!==undefined && v!=="" && v!==null; }).length; }

function updateHud(){
  const all=gradable(); const ans=answeredCount();
  document.getElementById("bar").style.width = Math.round(ans/all.length*100)+"%";
  if(!checked) document.getElementById("chip").textContent = ans+" / "+all.length+" đã làm";
}

function check(){
  const all=gradable(); let correct=0;
  all.forEach(g=>{
    const w=g.w, id=g.id, val=state[id];
    let ok=false;
    if(w.k==="input"){ const acc=(w.accept||[w.ans]).map(norm); ok=acc.includes(norm(val)); }
    else ok = (val!==undefined && String(val)===String(w.ans));
    if(ok) correct++;
    markWidget(g, ok);
  });
  checked=true;
  const pct=Math.round(correct/all.length*100);
  document.getElementById("chip").textContent = correct+" / "+all.length+" đúng";
  showResult(pct, correct, all.length);
  document.getElementById("check").style.display="none";
  document.getElementById("msg").textContent="Cuộn lên xem đáp án nhé!";
  window.scrollTo({top:0,behavior:"smooth"});
}

function markWidget(g, ok){
  const w=g.w, id=g.id;
  if(w.k==="choice"){
    document.querySelectorAll('.opt[data-id="'+id+'"]').forEach(b=>{
      b.classList.remove("sel");
      if(String(b.dataset.val)===String(w.ans)) b.classList.add("good");
      else if(b.dataset.val===state[id]) b.classList.add("bad");
      b.style.pointerEvents="none";
    });
  } else {
    const field=document.getElementById("field_"+id);
    const el=document.getElementById(id);
    if(el) el.disabled=true;
    if(field){
      field.classList.add(ok?"good":"bad");
      const slot=field.querySelector(".markslot");
      if(slot){ slot.innerHTML = ok ? '<span class="mark good">✓</span>' :
        '<span class="mark bad">✗</span> <span class="correct">'+w.ans+'</span>'; }
    }
  }
}

function showResult(pct, correct, total){
  const r=document.getElementById("result"); r.classList.add("show");
  document.getElementById("rscore").textContent = pct+"%";
  const nstars = pct>=90?5:pct>=75?4:pct>=60?3:pct>=40?2:1;
  document.getElementById("rstars").textContent = "⭐".repeat(nstars)+"☆".repeat(5-nstars);
  let m = pct>=90?"Xuất sắc! Em giỏi quá! 🎉" : pct>=75?"Làm tốt lắm! 👏" :
          pct>=50?"Cố lên, em làm được! 💪" : "Mình cùng ôn lại nhé! 🌱";
  document.getElementById("rmsg").textContent = m + "  ("+correct+"/"+total+")";
}

function reset(){
  state={}; checked=false; save();
  document.getElementById("result").classList.remove("show");
  document.getElementById("check").style.display="";
  document.getElementById("msg").textContent="";
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.getElementById("hi").innerHTML = (SVGS["face_happy"]||"") + (SVGS["star"]||"") + (SVGS["face_surprised"]||"");
document.getElementById("check").addEventListener("click",check);
document.getElementById("reset").addEventListener("click",reset);
render();
</script>
